server:
  port: 8082

spring:
  application:
    name: habit-tracker

  # H2 file-based database - free, embedded, zero setup.
  # Data persists in ./data/habittracker.mv.db between restarts.
  datasource:
    url: jdbc:mysql://localhost:3306/habittracker
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Vipink92@

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # For a personal/local project this is fine hardcoded.
    # If you ever deploy publicly, move this to an environment variable.
    secret: "ChangeThisToALongRandomSecretKeyForJWTSigningAtLeast256BitsLong123456"
    expiration-ms: 86400000   # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
