server:
  port: 8082

spring:
  application:
    name: habit-tracker

  # H2 file-based database - free, embedded, zero setup.
  # Data persists in ./data/habittracker.mv.db between restarts.
  datasource:
    url: jdbc:h2:file:./data/habittracker;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # For a personal/local project this is fine hardcoded.
    # If you ever deploy publicly, move this to an environment variable.
    secret: "ChangeThisToALongRandomSecretKeyForJWTSigningAtLeast256BitsLong123456"
    expiration-ms: 86400000   # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
